<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!-- Klinik Putrijaya mascot (original design, Mei, 8 Nov 2026). Working name: "Ceria" (pending AIN's approval).
       A rounded pink droplet with a small nurse cap. Palette: #fddbec #fdcae3 #f9a6d0, black outlines, logo hot pink #f93b99 as accent only.
       Layers for animation: #eyes-open / #eyes-blink, #mouth-closed / #mouth-half / #mouth-open, #arm-left / #arm-right (wave). -->
  <g id="mascot" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
    <ellipse id="shadow" cx="200" cy="462" rx="120" ry="12" fill="#fdcae3" stroke="none"/>
    <g id="feet" stroke-width="6" fill="#f9a6d0">
      <ellipse cx="155" cy="440" rx="34" ry="18"/>
      <ellipse cx="245" cy="440" rx="34" ry="18"/>
    </g>
    <g id="arm-left" stroke-width="6" fill="#f9a6d0" style="transform-origin:78px 300px">
      <path d="M84 282 C 48 270, 26 248, 30 226 C 34 210, 54 210, 62 226 C 70 244, 84 258, 98 268 Z"/>
    </g>
    <g id="arm-right" stroke-width="6" fill="#f9a6d0" style="transform-origin:322px 300px">
      <path d="M316 282 C 350 296, 366 320, 360 340 C 354 354, 336 352, 330 338 C 324 322, 312 312, 302 306 Z"/>
    </g>
    <path id="body" d="M200 34 C 168 96, 62 182, 62 292 A138 138 0 0 0 338 292 C 338 182, 232 96, 200 34 Z" fill="#f9a6d0" stroke-width="7"/>
    <ellipse id="belly" cx="200" cy="350" rx="92" ry="66" fill="#fdcae3" stroke="none"/>
    <path id="shine" d="M118 236 C 120 204, 138 176, 160 156" fill="none" stroke="#fff" stroke-width="10"/>
    <g id="cap" stroke-width="5">
      <path d="M140 152 Q142 104 200 96 Q258 104 260 152 Q200 136 140 152 Z" fill="#fff"/>
      <path d="M193 108h14v10h10v14h-10v10h-14v-10h-10v-14h10z" fill="#f93b99" stroke-width="3"/>
    </g>
    <g id="cheeks" stroke="none" fill="#f93b99" opacity=".35">
      <ellipse cx="128" cy="300" rx="22" ry="13"/>
      <ellipse cx="272" cy="300" rx="22" ry="13"/>
    </g>
    <g id="eyes-open">
      <ellipse cx="160" cy="256" rx="14" ry="20" fill="#000" stroke="none"/>
      <ellipse cx="240" cy="256" rx="14" ry="20" fill="#000" stroke="none"/>
      <circle cx="165" cy="248" r="5" fill="#fff" stroke="none"/>
      <circle cx="245" cy="248" r="5" fill="#fff" stroke="none"/>
    </g>
    <g id="eyes-blink" fill="none" stroke-width="6" style="display:none">
      <path d="M144 258 Q160 270 176 258"/>
      <path d="M224 258 Q240 270 256 258"/>
    </g>
    <g id="mouth-closed" fill="none" stroke-width="6">
      <path d="M178 300 Q200 320 222 300"/>
    </g>
    <g id="mouth-half" stroke-width="5" style="display:none">
      <path d="M176 298 Q200 296 224 298 Q220 326 200 328 Q180 326 176 298 Z" fill="#000"/>
      <path d="M186 318 Q200 310 214 318 Q208 326 200 326 Q192 326 186 318 Z" fill="#f93b99" stroke="none"/>
    </g>
    <g id="mouth-open" stroke-width="5" style="display:none">
      <path d="M172 294 Q200 290 228 294 Q228 344 200 346 Q172 344 172 294 Z" fill="#000"/>
      <path d="M182 332 Q200 318 218 332 Q212 344 200 344 Q188 344 182 332 Z" fill="#f93b99" stroke="none"/>
    </g>
  </g>
</svg>
